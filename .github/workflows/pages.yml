# Runs the tests on every push and pull request. On main, also publishes the app
# to GitHub Pages (HTTPS, which WebXR requires).
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser:
    # Loads the app in headless Chromium with a fake headset (tests/e2e/xr-mock.js)
    # and exercises desktop walking and the VR path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve and run
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e/xr.e2e.mjs http://localhost:8080/

  deploy:
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        # Only what the browser needs. Tools, tests and source DEMs stay out.
        # Code goes under v/<commit>/ so each deploy gets fresh URLs. Browsers keep
        # Pages files for 10 minutes and a normal reload doesn't refetch them, so
        # without this a reload could pair a new page with old code.
        run: |
          V="v/${GITHUB_SHA::12}"
          mkdir -p "_site/$V"
          cp -r src vendor "_site/$V/"
          cp -r sites _site/
          sed -e "s#\./vendor/#./$V/vendor/#g" -e "s#\./src/main\.js#./$V/src/main.js#" index.html > _site/index.html
          grep -q "$V/src/main.js" _site/index.html
          grep -q "$V/vendor/three/three.module.js" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
